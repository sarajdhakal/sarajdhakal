<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal animation: saraj@engineering, Computer Engineer building SaaS, CMS/CRM and backend systems">
  <defs>
    <linearGradient id="winGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="clipL1"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="430" dur="0.9s" begin="0.3s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clipL2"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="620" dur="1.1s" begin="1.4s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clipL3"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="560" dur="1.0s" begin="2.7s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clipL4"><rect x="0" y="0" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="1.0s" begin="3.9s" fill="freeze" calcMode="linear"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="798" height="218" rx="10" fill="url(#winGrad)" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <rect x="1" y="1" width="798" height="34" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="1" y="24" width="798" height="11" fill="#161b22"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="400" y="22" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8b949e">saraj@engineering: ~</text>

  <!-- body -->
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17">
    <g clip-path="url(#clipL1)">
      <text x="28" y="72" fill="#58a6ff">saraj@engineering</text>
      <text x="192" y="72" fill="#8b949e">:</text>
      <text x="200" y="72" fill="#79c0ff">~</text>
      <text x="216" y="72" fill="#8b949e">$</text>
      <text x="232" y="72" fill="#c9d1d9">whoami</text>
    </g>

    <g clip-path="url(#clipL2)">
      <text x="28" y="108" fill="#7ee787">Computer Engineer — building SaaS, CMS/CRM &amp; backend systems</text>
    </g>

    <g clip-path="url(#clipL3)">
      <text x="28" y="144" fill="#8b949e">Stack:</text>
      <text x="90" y="144" fill="#e3b341">React · Next.js · Node.js · Django · PostgreSQL</text>
    </g>

    <g clip-path="url(#clipL4)">
      <text x="28" y="180" fill="#58a6ff">saraj@engineering</text>
      <text x="192" y="180" fill="#8b949e">:</text>
      <text x="200" y="180" fill="#79c0ff">~</text>
      <text x="216" y="180" fill="#8b949e">$</text>
      <text x="232" y="180" fill="#c9d1d9">_</text>
    </g>

    <rect x="530" y="164" width="10" height="20" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" begin="4.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
