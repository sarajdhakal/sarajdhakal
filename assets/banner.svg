<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Terminal window showing an animated introduction for Saraj Dhakal, Computer Engineer">
  <defs>
    <linearGradient id="winGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="798" height="218" rx="10" fill="url(#winGrad)" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <rect x="1" y="1" width="798" height="34" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="1" y="24" width="798" height="11" fill="#161b22"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="400" y="22" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8b949e">saraj@engineering: ~</text>

  <!-- prompt line -->
  <text x="28" y="70" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="16">
    <tspan fill="#58a6ff">saraj@engineering</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#8b949e">$</tspan><tspan fill="#c9d1d9"> whoami</tspan>
  </text>

  <!-- animated typing response, embedded from the typing-svg engine -->
  <image x="24" y="88" width="752" height="110"
    href="https://readme-typing-svg.demolab.com?font=Fira+Code&amp;size=20&amp;pause=1000&amp;color=7EE787&amp;background=00000000&amp;center=false&amp;vCenter=true&amp;width=752&amp;height=110&amp;lines=Computer+Engineer;Full-Stack+Software+Engineer;Building+SaaS%2C+CMS%2FCRM+%26+B2B+platforms"
    preserveAspectRatio="xMinYMid meet"/>
</svg>
